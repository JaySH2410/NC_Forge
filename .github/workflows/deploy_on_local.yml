# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: Deploy On Local

on:
  workflow_dispatch:
  
jobs:
  deploy:
  
    runs-on: self-hosted

    steps:
    - name: Download Artifact
      uses: actions/download-artifact@v4
      with:
        name: forge-api
        path: deployment

    - name: Show Files
      shell: pwsh
      run: |
        Get-ChildItem deployment -Recurse
        
    - name: Create Deployment Folder
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path "C:\Jay\Deployments\Forge"
        
    - name: Copy Files
      shell: pwsh
      run: |
        Copy-Item "deployment\*" "C:\Jay\Deployments\Forge" -Recurse -Force
