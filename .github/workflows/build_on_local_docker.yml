# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net
name: Build Docker Image

permissions:
  contents: read
  packages: write

on:
  workflow_dispatch:

jobs:
  build:

    runs-on: self-hosted

    steps:

      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache NuGet Packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore Forge.slnx

      - name: Build
        run: dotnet build Forge.slnx --configuration Release --no-restore

      - name: Build Docker Image
        run: docker build -t ghcr.io/${{ github.repository_owner }}/forge-api:latest .

      - name: Push Docker Image
        run: docker push ghcr.io/${{ github.repository_owner }}/forge-api:latest
