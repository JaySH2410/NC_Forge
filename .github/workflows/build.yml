# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: Build

on:
  push:
    branches: [ "main", "develop", "feature/**" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source
      uses: actions/checkout@v4
    
    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
        
    - name: Restore Dependencies
      run: dotnet restore Forge.slnx
      
    - name: Build
      run: dotnet build Forge.slnx --configuration Release --no-restore
      
    # - name: Test
    #   run: dotnet test Forge.slnx --configuration Release --no-build
    
    - name: Publish Application
      run: dotnet publish Forge.csproj --configuration Release --no-build --output ./publish

    - name: Upload Publish Artifact
      uses: actions/upload-artifact@v4
      with:
        name: forge
        path: ./publish
